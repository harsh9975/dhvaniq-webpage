<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">A conversation and its call recording</title><desc id="desc">A Dhvaniq conversation workspace with a foreground call recording card, audio waveform and session duration.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#183d2b" flood-opacity=".08"/></filter><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#aac5b4"/></pattern><clipPath id="clip"><rect x="16" y="16" width="608" height="408" rx="18"/></clipPath></defs><g font-family="Inter,Arial,sans-serif"><rect width="640" height="440" fill="#f7f9f7"/><rect x="16" y="16" width="608" height="408" rx="18" fill="#edf4ef" stroke="#d2e0d6"/><g clip-path="url(#clip)"><path d="M16 276Q138 276 202 424H16Z" fill="url(#dots)"/><rect x="178" y="46" width="490" height="370" rx="12" fill="#fff" stroke="#dfe7e2"/><rect x="198.0" y="69.5" width="1.5" height="5.0" rx="0.75" fill="#0c6a4e" stroke="none"/><rect x="202.5" y="66.0" width="1.5" height="12.0" rx="0.75" fill="#0c6a4e" stroke="none"/><rect x="207.0" y="68.0" width="1.5" height="8.0" rx="0.75" fill="#0c6a4e" stroke="none"/><rect x="211.5" y="63.5" width="1.5" height="17.0" rx="0.75" fill="#0c6a4e" stroke="none"/><rect x="216.0" y="66.0" width="1.5" height="12.0" rx="0.75" fill="#0c6a4e" stroke="none"/><rect x="220.5" y="69.5" width="1.5" height="5.0" rx="0.75" fill="#0c6a4e" stroke="none"/><text x="238" y="78" font-size="16" fill="#203e32" font-weight="500">Conversations</text><path d="M178 100H668" fill="none" stroke="#e5ebe7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="202" y="129" font-size="16" fill="#203e32" font-weight="500">Maya · Dental assistant</text><rect x="202" y="145" width="362" height="61" rx="8" fill="#f4f7f4" stroke="none"/><text x="218" y="171" font-size="16" fill="#203